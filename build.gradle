plugins {
    id "dev.architectury.loom-no-remap" version "1.17.487" apply false
    id "architectury-plugin" version "3.5.169"
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}
allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group

    //adds the build number to the end of the version string if on a build server
    if (System.getenv().GITHUB_RUN_NUMBER != null) {
        version += ".${System.getenv().GITHUB_RUN_NUMBER}"
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "$rootProject.archives_name-$project.name-$minecraft_version"
    }

    repositories {
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }
}
